<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Главная</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }

    header {
      background-color: #4a90e2;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #dff0ff;
    }

    main {
      padding: 40px;
    }

    h1 {
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">Магазин одежды</a>
    <nav>
      <a href="/">Главная</a>
      <a href="{% url 'catalog' %}">Каталог</a>
      <a href="/cart">Корзина</a>
      <a href="/account">Личный кабинет</a>
    </nav>
  </header>

  <main>
    <h1>Добро пожаловать в интернет-магазин одежды!</h1>
    <p>Выберите категорию в меню сверху.</p>
  </main>

</body>
</html>
